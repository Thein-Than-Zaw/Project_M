spring:
  application:
    name: couple-private-space
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    clean-disabled: true
    validate-on-migrate: true
    baseline-on-migrate: false
  servlet:
    multipart:
      max-file-size: 100000000B
      max-request-size: 101000000B
      file-size-threshold: 0
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  servlet:
    session:
      tracking-modes: cookie
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
  tomcat:
    max-http-form-post-size: 16KB
app:
  calls:
    turn-urls: ${TURN_URLS:}
    stun-urls: ${STUN_URLS:}
    turn-secret: ${TURN_SHARED_SECRET:}
    turn-username: ${TURN_USERNAME:}
    turn-password: ${TURN_PASSWORD:}
    maintenance-ms: 2000
  memories:
    storage-root: ${MEMORY_STORAGE_ROOT:.local/uploads}
    ffprobe: ${FFPROBE_PATH:.tools/ffmpeg/ffmpeg-8.1.2-essentials_build/bin/ffprobe.exe}
    ffmpeg: ${FFMPEG_PATH:.tools/ffmpeg/ffmpeg-8.1.2-essentials_build/bin/ffmpeg.exe}
    maintenance-ms: 60000
  couple:
    # Owner-confirmed Myanmar Standard Time; event timestamps remain UTC.
    timezone: Asia/Yangon
  pairing:
    invite-hours: 24
    request-limit: ${PAIRING_REQUEST_LIMIT:30}
  chat:
    sends-per-minute: ${CHAT_SENDS_PER_MINUTE:60}
    acks-per-minute: ${CHAT_ACKS_PER_MINUTE:120}
  websocket:
    allowed-origins: http://localhost:${server.port},http://127.0.0.1:${server.port}
  auth:
    registration-token-hours: ${REGISTRATION_TOKEN_HOURS:24}
    login-account-limit: ${LOGIN_ACCOUNT_LIMIT:10}
    login-ip-limit: ${LOGIN_IP_LIMIT:30}
    registration-ip-limit: ${REGISTRATION_IP_LIMIT:10}
    rate-window-seconds: ${AUTH_RATE_WINDOW_SECONDS:900}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
