# HOST-01: no paid disks/services. Supply secrets through Render, never Git.
services:
  - type: web
    name: couple-private-space
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health/readiness
    autoDeployTrigger: 'off'
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: MEMORY_S3_BUCKET
        value: couple-memories
